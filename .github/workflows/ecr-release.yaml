# Publishes the gateway image to our own private ECR registry on a
# published GitHub Release, mirroring world-chain-rundler's
# .github/workflows/ecr-release.yaml. Images are not published to GHCR
# or any public registry.
name: Release private image

on:
  release:
    types: [published]

permissions:
  contents: read
  id-token: write

concurrency:
  group: ecr-release-${{ github.event.release.tag_name }}
  cancel-in-progress: false

env:
  AWS_REGION: eu-central-1
  ECR_REPOSITORY: oblivious-gateway-rs

jobs:
  release:
    if: startsWith(github.event.release.tag_name, 'v')
    runs-on:
      group: arc-public-8xlarge-amd64-runner
    timeout-minutes: 60
    steps:
      - name: Validate version
        env:
          VERSION: ${{ github.event.release.tag_name }}
        run: |
          if [[ ! "$VERSION" =~ ^v[0-9]+\.[0-9]+\.[0-9]+$ ]]; then
            echo "Use a plain semver tag like v0.1.0"
            exit 1
          fi

      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1 https://github.com/actions/checkout/releases/tag/v7.0.1
        with:
          ref: ${{ github.sha }}
          fetch-depth: 0
          persist-credentials: false

      - name: Verify release commit is on main
        run: git merge-base --is-ancestor HEAD origin/main

      - name: Build and publish
        id: build
        uses: worldcoin/gh-actions/ecr-build-and-push@b817e2d692e8bbd25307a385bd761d8edc2c090c # ecr-build-and-push-v3
        with:
          use_central_ecr_repo: "true"
          service_name: oblivious-gateway-rs
          ecr_repo: ${{ env.ECR_REPOSITORY }}
          dockerfile: Dockerfile
          platform: linux/amd64
          tags: |
            type=raw,value=${{ github.event.release.tag_name }}
          cache-from: type=gha,scope=ecr-release
          cache-to: type=gha,mode=max,scope=ecr-release

      - name: Record release
        env:
          IMAGE: ${{ env.AWS_ACCOUNT_ID }}.dkr.ecr.${{ env.AWS_REGION }}.amazonaws.com/${{ env.ECR_REPOSITORY }}:${{ github.event.release.tag_name }}
          DIGEST: ${{ steps.build.outputs.image-digest }}
        run: |
          if [[ -z "$DIGEST" ]]; then
            echo "No image was published. Use an unused version if the tag already exists."
            exit 1
          fi
          {
            echo "### Private image release"
            echo "Image: \`$IMAGE\`"
            echo "Digest: \`$DIGEST\`"
            echo "Source commit: \`$GITHUB_SHA\`"
          } >> "$GITHUB_STEP_SUMMARY"
