name: Gateway load test

on:
  workflow_dispatch:
    inputs:
      duration:
        description: Duration per rate (baseline and gateway measured separately)
        default: 30s
        required: true

permissions:
  contents: read

jobs:
  load:
    name: Load (${{ matrix.kem }})
    strategy:
      fail-fast: false
      matrix:
        kem: [x25519, xwing]
    runs-on:
      group: arc-public-4xlarge-amd64-runner
    timeout-minutes: 30
    env:
      PROBE_IMAGE: ghcr.io/worldcoin/ohttp-tools/ohttp-probe:latest
    services:
      target:
        image: nginx:alpine
        ports:
          - 18080:80
        options: --log-driver none
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: dtolnay/rust-toolchain@6c977a6ca4077a0ceb28ffbe03f59d46e9ac8772
        with:
          toolchain: stable
      - name: Build
        run: |
          sudo apt-get update && sudo apt-get install -y cmake clang
          cargo build --release --locked
      - name: Download load tools
        run: |
          docker pull "$PROBE_IMAGE"
          cd "$RUNNER_TEMP"
          release=https://github.com/tsenart/vegeta/releases/download/v12.13.0
          curl -fsSLO "$release/vegeta_12.13.0_linux_amd64.tar.gz"
          curl -fsSLO "$release/vegeta_12.13.0_checksums.txt"
          grep 'vegeta_12.13.0_linux_amd64.tar.gz$' vegeta_12.13.0_checksums.txt | sha256sum --check --strict
          tar -xzf vegeta_12.13.0_linux_amd64.tar.gz vegeta
      - name: Run local rate sweep
        env:
          DURATION: ${{ inputs.duration }}
          KEM: ${{ matrix.kem }}
        run: |
          set -euo pipefail
          mkdir -p load-results
          { git rev-parse HEAD; rustc --version; docker image inspect "$PROBE_IMAGE" --format '{{json .RepoDigests}}'; lscpu; } > load-results/environment.txt
          probe=(docker run --rm --network host "$PROBE_IMAGE")
          cat > "$RUNNER_TEMP/gateway.toml" <<'TOML'
          [server]
          listen_addr = "127.0.0.1:18081"
          [metrics]
          listen_addr = "127.0.0.1:19090"
          [forwarding]
          allowed_targets = ["127.0.0.1:18080"]
          [[generations]]
          x25519 = { key_id = 0 }
          seed = { hex = "000102030405060708090a0b0c0d0e0f101112131415161718191a1b1c1d1e1f" }
          TOML
          target/release/oblivious-gateway --config "$RUNNER_TEMP/gateway.toml" > load-results/gateway.log 2>&1 &
          gateway_pid=$!
          trap 'kill "$gateway_pid" 2>/dev/null || true; wait "$gateway_pid" 2>/dev/null || true' EXIT
          for url in http://127.0.0.1:18080/ http://127.0.0.1:18081/health http://127.0.0.1:19090/metrics; do
            curl --retry 20 --retry-connrefused --retry-delay 1 --max-time 5 -fsS "$url" > /dev/null
          done
          args=(-kem "$KEM" -relay-url http://127.0.0.1:18081/gateway -keys-url http://127.0.0.1:18081/ohttp-keys -target-url http://127.0.0.1:18080/ -t 35s)
          "${probe[@]}" load "${args[@]}" -qps 100 -duration 3s > load-results/warmup.log 2>&1
          printf '%s; all processes share the runner. Inspect achieved rate as well as errors. Probe latency includes client crypto and target time. Gateway timing histograms are in the artifacts.\n' "$KEM" >> "$GITHUB_STEP_SUMMARY"
          failed=0
          for rate in 1 10 100 1000 10000; do
            # Check the static target independently at the same offered rate.
            printf 'GET http://127.0.0.1:18080/\n' | "$RUNNER_TEMP/vegeta" attack -rate "$rate/s" -duration "$DURATION" > "load-results/target-$rate.bin"
            "$RUNNER_TEMP/vegeta" report "load-results/target-$rate.bin" > "load-results/target-$rate.txt"
            curl -fsS http://127.0.0.1:19090/metrics > "load-results/gateway-$rate-before.prom"
            if ! "${probe[@]}" load "${args[@]}" -qps "$rate" -duration "$DURATION" > "load-results/ohttp-$rate.log" 2>&1; then failed=1; fi
            curl -fsS http://127.0.0.1:19090/metrics > "load-results/gateway-$rate-after.prom"
            {
              printf '\n### %s RPS\n\nTarget baseline:\n~~~text\n' "$rate"
              cat "load-results/target-$rate.txt"
              printf '\n~~~\n\nOHTTP:\n~~~text\n'
              cat "load-results/ohttp-$rate.log"
              printf '\n~~~\n'
            } >> "$GITHUB_STEP_SUMMARY"
          done
          exit "$failed"
      - name: Upload results
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: gateway-load-results-${{ matrix.kem }}
          path: load-results/
