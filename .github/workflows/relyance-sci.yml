name: Relyance SCI Scan

on:
  schedule:
    - cron: "5 0 * * *"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  execute-relyance-sci:
    name: Relyance SCI Job
    runs-on:
      group: arc-public-large-amd64-runner
    permissions:
      contents: read

    steps:
      - name: Run Relyance SCI
        uses: worldcoin/gh-actions-public/relyance@f6402ebbd079e0c8bb91c5e552c281ce6132f11b # main https://github.com/worldcoin/gh-actions-public/commit/f6402ebbd079e0c8bb91c5e552c281ce6132f11b
        with:
          secrets-dpp-sci-key: ${{ secrets.DPP_SCI_KEY }}
