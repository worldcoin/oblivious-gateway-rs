# cargo-deny license gate (DESIGN.md: "review dependency licenses before
# distribution"). Run locally with `cargo deny check licenses`, or via the
# `deny` CI job. Only permissive licenses are allowed; nothing copyleft.
# A dependency licensed under one of these OR a disallowed license (e.g.
# "MIT OR GPL-3.0") still passes, since cargo-deny only requires one
# satisfiable option from the allow-list.

[licenses]
allow = [
    "MIT",
    "Apache-2.0",
    "Apache-2.0 WITH LLVM-exception",
    "BSD-1-Clause",
    "BSD-2-Clause",
    "BSD-3-Clause",
    "ISC",
    "Unicode-3.0",
    "Zlib",
    "CDLA-Permissive-2.0",
    "BSL-1.0",
    "Unlicense",
    "MIT-0",
    "CC0-1.0",
]
confidence-threshold = 0.9

[bans]
multiple-versions = "allow"

[sources]
unknown-registry = "deny"
unknown-git = "deny"
