# cargo-deny gate: licenses (DESIGN.md: "review dependency licenses before
# distribution"), banned/duplicate dependencies, source registries, and
# security advisories. CI runs these as two jobs matching the org
# convention (see .github/workflows/ci.yml): `licenses`/`bans`/`sources`
# are a hard gate, `advisories` is soft (continue-on-error) since a new
# RUSTSEC entry can appear for a dependency with no fix available yet and
# shouldn't silently block unrelated pull requests.
#
# Run locally: `cargo deny check licenses`, `cargo deny check bans sources`,
# `cargo deny check advisories`.

[advisories]
# No ignored advisories at present. If one needs to be temporarily
# accepted (e.g. no upgrade path exists yet), add its RUSTSEC ID here with
# a comment explaining why and a link to tracking the fix.
ignore = []

[licenses]
# A dependency licensed under one of these OR a disallowed license (e.g.
# "MIT OR GPL-3.0") still passes, since cargo-deny only requires one
# satisfiable option from the allow-list.
allow = [
    "MIT",
    "Apache-2.0",
    "Apache-2.0 WITH LLVM-exception",
    "BSD-1-Clause",
    "BSD-2-Clause",
    "BSD-3-Clause",
    "ISC",
    "Unicode-3.0",
    "Zlib",
    "CDLA-Permissive-2.0",
    "BSL-1.0",
    "Unlicense",
    "MIT-0",
    "CC0-1.0",
]
confidence-threshold = 0.9

[bans]
multiple-versions = "allow"

[sources]
unknown-registry = "deny"
unknown-git = "deny"
