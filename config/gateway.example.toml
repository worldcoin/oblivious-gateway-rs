# Example oblivious-gateway-rs configuration.
#
# Configuration is loaded once at startup; there is no hot reload.
# Retain old generations for decryption when rotating keys. Every replica
# must load new keys before clients start using them. Whether this needs
# one or two gateway rollouts depends on how clients adopt public configs;
# see docs/operations.md for both rotation approaches.

[server]
listen_addr = "0.0.0.0:8080"
shutdown_grace_seconds = 30
# Keep serving this long after SIGTERM before draining, e.g. instead of a
# Kubernetes preStop sleep (the image has no shell). Defaults to 0.
# shutdown_delay_seconds = 10
# Concurrent handlers, not requests/sec. Tune for traffic, latency and memory.
max_in_flight_requests = 128

# Optional incoming TLS. Omit this section to serve plaintext HTTP, e.g.
# when TLS terminates at an upstream load balancer.
# [server.tls]
# cert_file = "/etc/oblivious-gateway/tls/cert.pem"
# key_file = "/etc/oblivious-gateway/tls/key.pem"

# Prometheus metrics are served at /metrics on their own listener. Omit this
# section to disable metrics entirely. For Docker port publishing or a
# remote scraper, bind to "0.0.0.0:9090" and restrict access with host port
# bindings/firewall/network policies. Metrics have no authentication.
[metrics]
listen_addr = "127.0.0.1:9090"

[forwarding]
# Exact host[:port] allowlist matched against the BHTTP authority, or Host
# when authority is absent. Checked before rewrites.
# Required unless the process is started with --allow-any-target.
allowed_targets = ["api.example.com", "internal.example.com:8443"]

# Optional scheme/host rewrites applied after the allowlist check, e.g. to
# route a public hostname to an internal service address. The outbound Host
# becomes the rewritten destination; the original client Host is not retained.
[forwarding.rewrites]
"internal.example.com:8443" = { scheme = "https", host = "internal-service.svc.cluster.local:443" }

# At least one key generation is required. Each generation is one
# self-contained block below: its own seed plus its own two key IDs. Each
# generation derives one X25519 key and one X-Wing key from its own master
# seed - different generations use different, independently generated
# seeds, never a value derived from another generation's seed. See
# GLOSSARY.md for why both keys use transformed copies of the seed.
#
# `seed` accepts inline hex (local testing only - see below), an
# environment variable name, or a file path, e.g. `seed = { file = "/run/secrets/..." }`.
#
# Every generation requires an explicit `x25519.key_id`, including the first.
# Omit `xwing` (or its `key_id`) to derive it from the X25519 key ID by
# subtracting 64 (wrapping at 256), Go's ID layout. Give each new
# generation the next X25519 ID. IDs must be unique across all loaded keys.
# Keep IDs stable when reordering or removing generations.
# `advertise` defaults to true and controls both KEMs together; false loads
# both keys for decryption without publishing them. Each advertised generation
# publishes X25519 then X-Wing; clients determine which supported key to use.
[[generations]]
x25519 = { key_id = 128 }
# Seed material should come from an environment variable or a mounted file
# in production; inline hex seeds are intended for local testing only.
seed = { env = "OBLIVIOUS_GATEWAY_SEED" }
# xwing omitted here: this generation gets key IDs 128 and 64.

# Example of a second, retained-but-not-advertised generation during
# rotation - note its own independent seed (never derived from the first
# generation's seed above) and its own stable x25519 key ID:
# [[generations]]
# x25519 = { key_id = 129 }
# advertise = false
# seed = { file = "/run/secrets/oblivious-gateway-seed-2" }
